workflows:
  android-release:
    name: MY FARM Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Regenerate Android platform files (fix v1 embedding)
        script: flutter create --platforms=android .
      - name: Set application ID to com.afrotym.myfarm
        script: |
          BG="android/app/build.gradle.kts"
          perl -i -pe 's/namespace = "com\.example\.my_farm"/namespace = "com.afrotym.myfarm"/' "$BG"
          perl -i -pe 's/applicationId = "com\.example\.my_farm"/applicationId = "com.afrotym.myfarm"/' "$BG"
          echo "=== namespace/applicationId lines ==="
          grep -E "namespace|applicationId" "$BG"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app launcher icon (leaf logo)
        script: flutter pub run flutter_launcher_icons
      - name: Patch tflite_flutter (JVM 17 + compileSdk 36)
        script: |
          PLUGIN=$(find "$HOME/.pub-cache" -type d -name "tflite_flutter-*" | head -1)
          GF="$PLUGIN/android/build.gradle"
          echo "Patching: $GF"
          # JVM 17
          perl -i -pe 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$GF"
          perl -0777 -i -pe 's/(compileOptions\s*\{[^}]*\})/$1\n    kotlinOptions {\n        jvmTarget = "17"\n    }/s unless /kotlinOptions/' "$GF"
          # Bump the plugin compileSdkVersion 31 -> 36 (deps require >=33)
          perl -i -pe 's/compileSdkVersion\s+31/compileSdkVersion 36/g' "$GF"
          # Bump the bundled TensorFlow Lite runtime so it understands ops from
          # newer TF (our Colab-exported EfficientNet models). 2.11 is too old.
          # Bump bundled TensorFlow Lite native runtime to match the TF version
          # used to train/export the models in Colab (fixes "Unable to create
          # interpreter" / "Didn't find op for builtin opcode" errors).
          perl -i -pe 's/def tflite_version = "2\.11\.0"/def tflite_version = "2.16.1"/' "$GF"
          echo "=== PATCHED tflite build.gradle ==="; cat "$GF"
      - name: Fix TensorFlow namespace conflict
        script: |
          GP="android/gradle.properties"
          {
            echo ""
            echo "android.uniquePackageNames=false"
            echo "android.nonTransitiveRClass=false"
          } >> "$GP"
          echo "=== gradle.properties ==="; cat "$GP"
      - name: Disable R8 minification
        script: |
          BG="android/app/build.gradle.kts"
          perl -0777 -i -pe 's/(release\s*\{)/$1\n            isMinifyEnabled = false\n            isShrinkResources = false/s unless /isMinifyEnabled/' "$BG"
          echo "=== release block ==="; grep -A6 "release {" "$BG"
      - name: Set up release signing key
        script: |
          # Decode the keystore from a Codemagic secure environment variable
          # (set CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
          # in Codemagic > App settings > Environment variables > group "release")
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > android/app/release.keystore
            cat > android/key.properties <<PROPS
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=release.keystore
          PROPS
            echo "Release keystore configured."
          else
            echo "No CM_KEYSTORE set - building with debug signing (Play Store will reject this)."
          fi
      - name: Wire signing config into build.gradle.kts
        script: |
          BG="android/app/build.gradle.kts"
          if [ -f android/key.properties ] && ! grep -q "keystoreProperties" "$BG"; then
            perl -0777 -i -pe 's/(plugins \{)/import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n$1/s' "$BG"
            perl -0777 -i -pe 's/(buildTypes \{)/signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String?\n            keyPassword = keystoreProperties["keyPassword"] as String?\n            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n            storePassword = keystoreProperties["storePassword"] as String?\n        }\n    }\n    $1/s' "$BG"
            perl -i -pe 's/signingConfig = signingConfigs.getByName\("debug"\)/signingConfig = signingConfigs.getByName("release")/' "$BG"
            echo "=== signing wired in ==="; cat "$BG"
          fi
      - name: Build Android App Bundle (for Play Store)
        script: flutter build appbundle --release
      - name: Build APK (for direct sharing)
        script: flutter build apk --release
      - name: Build DEBUG APK (shows real crash errors on screen)
        script: flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk